study:
  scope: "checkpoint-level proof-of-concept"
  seed: 42
  multi_seed_replication: false

training:
  common:
    num_train_epochs: 1
    optimizer: "adamw_torch"
    learning_rate: 3.0e-5
    weight_decay: 0.01
    warmup_ratio: 0.03
    max_source_length: 1024
    max_target_length: 512
    generation_max_length: 320
    generation_num_beams: 4
    early_stopping: true
    no_repeat_ngram_size: 3
    effective_batch_size: 16
  bart_base:
    model_name: "facebook/bart-base"
    per_device_train_batch_size: 8
    per_device_eval_batch_size: 8
    gradient_accumulation_steps: 2
  t5_base:
    model_name: "google-t5/t5-base"
    per_device_train_batch_size: 4
    per_device_eval_batch_size: 4
    gradient_accumulation_steps: 4

evaluation:
  matched_test_samples_per_condition: 500
  test_files:
    - test_clean.jsonl
    - test_noisy_easy_additive.jsonl
    - test_noisy_hard_additive.jsonl
    - test_noisy_easy_substitutive.jsonl
    - test_noisy_hard_substitutive.jsonl
  bertscore_model: "roberta-large"
  evidence_status:
    primary: "truncation_rate <= 0.05"
    qualified: "0.05 < truncation_rate <= 0.50"
    excluded: "truncation_rate > 0.50"

provenance:
  post_truncation_target_noise_token_provenance_available: false
  empirical_ner_reported: false
  empirical_target_specific_trr_reported: false

noise_pool:
  strategy: "shared_training_pool"
  status: "manuscript_aligned_reproduction_builder"
  source_split: "train"
  reused_for: [train, validation, test]
  current_public_builder: "src/databuildt.py"
  historical_exact_builder_snapshot_available: false
  note: >
    The current public builder implements the manuscript-described shared
    training-derived cross-document distractor pool. The retained artifacts do
    not prove byte-identical reconstruction of the historical data build.

source_data:
  builder_input_contract: "HuggingFace Dataset/DatasetDict with article and abstract fields"
  raw_source_ingestion_script_in_repository: false
  preparation_document: "docs/SOURCE_DATA_PREPARATION.md"
